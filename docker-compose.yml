services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: keystone_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - keystone_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keystone_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/keystone_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: "KeystoneDevSecretKeyMustBeAtLeast32CharsLong!"
      UPLOAD_DIR: uploads
      # Optional: demo seed
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"

volumes:
  keystone_db_data:

