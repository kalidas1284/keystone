# Production profile (Render / cloud)
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# Seed demo accounts on first deploy when the users table is empty
app.seed.demo=${APP_SEED_DEMO:true}

# Allow any Render static-site subdomain (avoids circular env dependency in render.yaml)
app.cors.allowed-origin-patterns=${APP_CORS_ORIGIN_PATTERNS:https://*.onrender.com}
