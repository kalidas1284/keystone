spring.application.name=keystone-backend
spring.profiles.default=local

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/keystone_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway migrations (schema managed by versioned scripts for clean reproducibility)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT — override via env JWT_SECRET or application-local.properties
app.jwt.secret=${JWT_SECRET:KeystoneDevSecretKeyMustBeAtLeast32CharsLong!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.upload.dir=${UPLOAD_DIR:uploads}
app.invoice.labor-rate=${LABOR_RATE:85.00}
app.sla.monitor-interval-ms=${SLA_MONITOR_INTERVAL_MS:300000}

# Comma-separated origins for CORS (set APP_CORS_ORIGINS in production)
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
