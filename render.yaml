# Render Blueprint — deploy frontend + backend + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: keystone-db
    databaseName: keystone_db
    plan: free

services:
  # Spring Boot API (Docker)
  - type: web
    name: keystone-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: APP_SEED_DEMO
        value: "true"
      - key: DB_HOST
        fromDatabase:
          name: keystone-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: keystone-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: keystone-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: keystone-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: keystone-db
          property: password

  # React SPA (static site)
  - type: web
    name: keystone-web
    runtime: static
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: keystone-api
          envVarKey: RENDER_EXTERNAL_URL
